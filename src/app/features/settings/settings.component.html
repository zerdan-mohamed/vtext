<vt-top-nav tab="realtime" />
<vt-side-history />

<!-- Background blobs -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-10">
  <div class="absolute top-[10%] left-[5%] w-96 h-96 bg-primary/20 blur-[120px] rounded-full"></div>
  <div class="absolute bottom-[10%] right-[10%] w-64 h-64 bg-secondary/20 blur-[100px] rounded-full"></div>
</div>

<main class="relative z-10 pt-24 pr-0 xl:pr-[22rem] min-h-screen flex items-center justify-center p-8">
  <div class="w-full max-w-2xl bg-surface-container-high rounded-xl border border-outline-variant/20 shadow-2xl overflow-hidden">
    <!-- Modal header -->
    <div class="px-8 py-6 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-highest/30">
      <div>
        <h1 class="text-2xl font-bold font-headline text-primary">Configuration</h1>
        <p class="text-sm text-on-surface-variant font-label">Tweak the frequency of your broadcast</p>
      </div>
      <button class="text-on-surface-variant hover:text-primary transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Settings body -->
    <div class="p-8 space-y-10">
      <!-- Engine Selection -->
      <section class="space-y-4">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">settings_suggest</span>
          <h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant font-label">Engine Selection</h3>
        </div>
        <div class="grid grid-cols-2 gap-4 p-1 bg-surface-container rounded-lg border border-outline-variant/20">
          <button
            (click)="prefs.engine.set('web-speech')"
            class="flex flex-col items-center justify-center gap-1 py-4 px-4 rounded-md transition-all border"
            [ngClass]="prefs.engine() === 'web-speech'
              ? 'bg-primary/10 text-primary border-primary/20'
              : 'bg-surface-container-lowest text-on-surface-variant border-transparent'">
            <span class="text-xs font-bold uppercase font-headline">Web Speech API</span>
            <span class="text-[10px] opacity-60">Latency Optimized (Basic)</span>
          </button>
          <button
            (click)="prefs.engine.set('whisper')"
            class="flex flex-col items-center justify-center gap-1 py-4 px-4 rounded-md transition-all border"
            [ngClass]="prefs.engine() === 'whisper'
              ? 'bg-primary/10 text-primary border-primary/20'
              : 'bg-surface-container-lowest text-on-surface-variant border-transparent'">
            <span class="text-xs font-bold uppercase font-headline">Whisper API</span>
            <span class="text-[10px] opacity-80">High Fidelity (Pro)</span>
          </button>
        </div>
      </section>

      <!-- API Authentication -->
      <section class="space-y-4">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">key</span>
          <h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant font-label">API Authentication</h3>
        </div>
        <div class="relative">
          <label class="block text-[10px] uppercase tracking-tighter mb-1 ml-1 text-on-surface-variant">Whisper / DeepL Endpoint Key</label>
          <div class="flex items-center gap-2">
            <input
              [type]="showKey() ? 'text' : 'password'"
              [ngModel]="prefs.apiKey()"
              (ngModelChange)="prefs.apiKey.set($event)"
              class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded px-4 py-3 text-sm font-mono text-primary focus:ring-1 focus:ring-primary focus:border-primary outline-none" />
            <button
              (click)="showKey.set(!showKey())"
              class="p-3 bg-surface-container-lowest border border-outline-variant/30 rounded text-on-surface-variant hover:text-primary transition-colors">
              <span class="material-symbols-outlined">{{ showKey() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Preferences grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <section class="space-y-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">tune</span>
            <h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant font-label">Preferences</h3>
          </div>
          <div class="space-y-3">
            <button
              (click)="prefs.autoPunctuation.set(!prefs.autoPunctuation())"
              class="w-full flex items-center justify-between p-3 bg-surface-container-lowest rounded border border-outline-variant/10 text-left">
              <span class="text-sm font-label">Auto-punctuation</span>
              <div class="w-10 h-5 rounded-full relative border transition-colors"
                   [ngClass]="prefs.autoPunctuation() ? 'bg-primary/20 border-primary/30' : 'bg-surface-variant border-white/10'">
                <div class="absolute top-1 w-3 h-3 bg-primary rounded-full transition-all"
                     [ngClass]="prefs.autoPunctuation() ? 'right-1' : 'left-1 opacity-40'"></div>
              </div>
            </button>
            <div class="relative">
              <label class="block text-[10px] uppercase mb-1 text-on-surface-variant">Default Target Language</label>
              <select
                [ngModel]="prefs.targetLangLabel()"
                (ngModelChange)="prefs.targetLangLabel.set($event)"
                class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded px-3 py-2 text-sm font-label focus:ring-1 focus:ring-primary outline-none appearance-none">
                @for (lang of targetLanguages; track lang) {
                  <option [value]="lang">{{ lang }}</option>
                }
              </select>
              <span class="material-symbols-outlined absolute right-3 bottom-2 text-xs pointer-events-none opacity-50">expand_more</span>
            </div>
          </div>
        </section>

        <!-- Typography -->
        <section class="space-y-4">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">text_fields</span>
            <h3 class="text-sm font-bold uppercase tracking-widest text-on-surface-variant font-label">Typography</h3>
          </div>
          <div class="space-y-4">
            <div class="px-2">
              <input type="range" min="1" max="3"
                     [ngModel]="prefs.fontSize()"
                     (ngModelChange)="prefs.fontSize.set(+$event)"
                     class="w-full h-1 bg-surface-container-lowest rounded-lg appearance-none cursor-pointer accent-primary" />
              <div class="flex justify-between mt-2 text-[10px] text-on-surface-variant font-mono">
                <span>SMALL</span>
                <span>MEDIUM</span>
                <span>LARGE</span>
              </div>
            </div>
            <div class="p-4 bg-surface-container-lowest border-l-2 border-primary rounded-r">
              <p class="text-xs uppercase opacity-40 mb-1 font-mono">Transcript Preview</p>
              <p class="font-mono leading-relaxed text-on-surface"
                 [style.font-size]="prefs.fontSize() === 1 ? '0.75rem' : prefs.fontSize() === 2 ? '1rem' : '1.25rem'">
                The broadcast is active. Capturing audio at 44.1kHz.
              </p>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-8 py-6 bg-surface-container-highest/20 border-t border-outline-variant/10 flex items-center justify-end gap-4">
      <button (click)="resetDefaults()" class="px-6 py-2.5 text-sm font-bold font-headline text-on-surface-variant hover:text-on-surface transition-all">
        Reset Defaults
      </button>
      <button (click)="saveChanges()" class="px-8 py-2.5 bg-primary text-on-primary font-bold font-headline rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all">
        Save Changes
      </button>
    </div>
  </div>
</main>
